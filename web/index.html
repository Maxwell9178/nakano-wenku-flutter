<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NakanoWenku · 完全离线的本地电子书 / 轻小说阅读器，网页版。">

  <!-- 让 App 铺满整个屏幕（刘海、圆角、底部指示条由 SafeArea 让开） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS：添加到主屏幕后全屏运行 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NakanoWenku">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">

  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>NakanoWenku</title>

  <style>
    /* 启动时先铺黑底，避免白屏闪一下 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000000;
      overscroll-behavior: none;
    }
    body { -webkit-tap-highlight-color: transparent; }
    #nw-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      transition: opacity 0.32s ease;
      z-index: 10;
    }
    #nw-boot.is-hidden { opacity: 0; pointer-events: none; }
    #nw-boot img { width: 78px; height: 78px; border-radius: 20px; opacity: 0.92; }
  </style>
  <link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="icons/splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)">
</head>
<body>
  <div id="nw-boot"><img src="icons/Icon-192.png" alt="NakanoWenku"></div>

  <script>
    // Flutter 首帧渲染完成后淡出启动遮罩
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('nw-boot');
      if (!boot) return;
      boot.classList.add('is-hidden');
      setTimeout(function () { boot.remove(); }, 400);
    });
    // 兜底：8 秒后无论如何移除，避免遮挡
    setTimeout(function () {
      var boot = document.getElementById('nw-boot');
      if (boot) boot.remove();
    }, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
